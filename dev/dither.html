<!DOCTYPE html>
<html>
  <head>
    <title>Ordered Dithering Alpha Blend</title>
    <style>
      canvas{width:512px!important;height:auto!important;}
      @font-face {
        font-family: 'Orbitron';
        src: url('/dev/Orbitron-Bold.ttf') format('truetype');
      }
      body{background-color:#fff;}
      #font-cont{display:flex;flex-wrap:nowrap;font:700 13px/1 Orbitron;text-align: center;}
      .font-char{width:16px;height:16px;display:flex;flex-shrink:0;justify-content:center;align-items:center;background-color:#fff;}
      .font-char span{position: relative;top:0.01em;}
    </style>
  </head>
  <body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <canvas id="canvas2" width="512" height="512"></canvas>
    <br><br>
    <input type="range" name="alpha" id="alpha" value="0" min="0" max="256" step="1">

    <div id="font-cont"></div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const canvas2 = document.getElementById("canvas2");
      const ctx2 = canvas2.getContext("2d");

      const colors = [
        [255, 0, 0],
        [0, 255, 0],
      ];
      const images = [
        '/res/tex/star_wars-lod1.jpg',
        '/res/tex/star_wars-lod2.jpg'
      ];
      const imgEls = [];

      const colLenMask = colors.length - 1;
      // Precompute the dithering patterns (you can use custom patterns)
      const ditherPattern = [
        [7, 12, 4, 14],
        [11, 2, 9, 1],
        [5, 15, 6, 13],
        [8, 0, 10, 3],
      ];
      const filterPattern = [
        [-0.0078125, 0, -0.0068359375, 0.0009765625],
        [0.00390625, -0.00390625, 0.0048828125, -0.0029296875],
        [-0.0048828125, 0.0029296875, -0.005859375, 0.001953125],
        [0.0068359375, -0.0009765625, 0.005859375, -0.001953125]
      ];

      let useAlpha = -1;
      function setAlpha(value) {
        const alpha = value + 8 >> 4;
        setCanvasDimensions(value);
        if (alpha !== useAlpha) {
          useAlpha = alpha;
          draw();
        }
        drawSexy();
      }

      const width1 = canvas.width;
      const width2 = width1 / 2;
      function setCanvasDimensions(alpha) {
        alpha = alpha / 256;
        // Interpolate between width1 and width2
        // const width = Math.floor(width1 + (width2 - width1) * alpha);
        // canvas.width = width;
        // canvas.height = width;
        // canvas.style.width = `${width}px`;
        // canvas.style.height = `${width}px`;
        // canvas2.width = width;
        // canvas2.height = width;
        // canvas2.style.width = `${width}px`;
        // canvas2.style.height = `${width}px`;
      }

      function draw() {
        const alpha = useAlpha;
        // const alpha = alphaValue + 2 >> 2;
        const pixelData = new Uint8ClampedArray(canvas.width * canvas.height * 4);
        const pixelData2 = new Uint8ClampedArray(canvas.width * canvas.height * 4);
        let u = 0.0;
        let v = 0.0;
        const u_step = 1.0 / canvas.width;
        const v_step = 1.0 / canvas.height;
        let rowIndex = 0;
        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const index = (rowIndex + x) << 2;
            const tx = x + canvas.width & 3;
            const ty = y - canvas.height & 3;
            // console.log(ditherPattern,alphaIndex,t);
            const i = ditherPattern[ty][tx] + alpha >> 4;
            const image = images[i];
            // const error = filterPattern[tx][ty];
            const color = sampleImage(u, v, image);
            // const color = colors[i];
            pixelData[index] = color[0];
            pixelData[index + 1] = color[1];
            pixelData[index + 2] = color[2];
            pixelData[index + 3] = 255;

            // const color2 = colors[i];
            // pixelData2[index] = color2[0];
            // pixelData2[index + 1] = color2[1];
            // pixelData2[index + 2] = color2[2];
            // pixelData2[index + 3] = 255;

            u += u_step;
          }
          rowIndex += canvas.width;
          v += v_step;
          u = 0.0;
        }
        // Create a new ImageData object
        const imageData = new ImageData(pixelData, canvas.width, canvas.height);
        // Draw the ImageData object at the given (x,y) coordinates.
        ctx.putImageData(imageData, 0, 0);
        // Create a new ImageData object
        // const imageData2 = new ImageData(pixelData2, canvas2.width, canvas2.height);
        // // Draw the ImageData2 object at the given (x,y) coordinates.
        // ctx2.putImageData(imageData2, 0, 0);
      }

      function drawSexy() {
        // Draw the real alpha blended color to canvas 2
        const alphaScale = alphaValue / 256;
        ctx2.drawImage(imgEls[0], 0, 0, canvas2.width, canvas2.height);
        // Render second image to the canvas at alphaScale
        ctx2.globalAlpha = alphaScale;
        ctx2.drawImage(imgEls[1], 0, 0, canvas2.width, canvas2.height);
      }

      function sampleImage(u, v, imageData) {
        const x = Math.floor(u * imageData.width);
        const y = Math.floor(v * imageData.height);
        const i = (y * imageData.width + x) * 4;
        return [
          imageData.data[i],
          imageData.data[i + 1],
          imageData.data[i + 2],
          imageData.data[i + 3]
        ];
      }

      function interpolateColor(color1, color2, factor) {
        // const color = [
        //   Math.round(color1[0] + factor * (color2[0] - color1[0])),
        //   Math.round(color1[1] + factor * (color2[1] - color1[1])),
        //   Math.round(color1[2] + factor * (color2[2] - color1[2]))
        // ];
        // // Normalize the color value so the top channel is 255
        // const max = Math.max(...color);
        // const fac = 255 / max;
        // color[0] = Math.round(color[0] * fac);
        // color[1] = Math.round(color[1] * fac);
        // color[2] = Math.round(color[2] * fac);
        // return color;
        // const color = [
        //   Math.round(color1[0] + factor * (color2[0] - color1[0])) / 255,
        //   Math.round(color1[1] + factor * (color2[1] - color1[1])) / 255,
        //   Math.round(color1[2] + factor * (color2[2] - color1[2])) / 255
        // ];
        // // The color channels are 0.0 to 1.0. Nomalize to a length of one.
        // const length = Math.sqrt(color[0] * color[0] + color[1] * color[1] + color[2] * color[2]);
        // color[0] /= length;
        // color[1] /= length;
        // color[2] /= length;
        // // Scale the color channels to 255
        // color[0] *= 255;
        // color[1] *= 255;
        // color[2] *= 255;
        // return color;
        const color = [
          Math.round(color1[0] + factor * (color2[0] - color1[0])),
          Math.round(color1[1] + factor * (color2[1] - color1[1])),
          Math.round(color1[2] + factor * (color2[2] - color1[2]))
        ];
        return color;
      }
      function loadImage(url) {
        return new Promise(res => {
          const image = new Image();
          image.onload = () => {
            const imgCanvas = document.createElement('canvas');
            imgCanvas.width = image.width;
            imgCanvas.height = image.height;
            const imgContext = imgCanvas.getContext('2d');
            imgContext.drawImage(image, 0, 0);
            const imgData = imgContext.getImageData(0, 0, imgCanvas.width, imgCanvas.height);
            const index = images.indexOf(url);
            images[index] = imgData;
            imgEls[index] = image;
            res();
          };
          image.src = url;
        });
      }

      Promise.all(
        images.map(url => loadImage(url))
      ).then(() => {
        setAlpha(0);
      });

      let alphaValue = 0;

      document.addEventListener("DOMContentLoaded", () => {
        const alphaSlider = document.getElementById("alpha");
        alphaValue = parseFloat(alphaSlider.value);
        alphaSlider.addEventListener("input", () => {
          alphaValue = parseFloat(alphaSlider.value);
          setAlpha(alphaValue);
        });
      });

      function renderFont() {
        const fontContainer = document.getElementById('font-cont');

        for (let i = 0; i < 256; i++) {
          const char = String.fromCharCode(i);
          console.log(char);
          const element = document.createElement('div');
          element.classList.add('font-char', 'char-code-' + i);
          element.innerHTML = `<span>${char}</span>`;
          fontContainer.appendChild(element);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderFont();
      });
    </script>
  </body>
</html>
